{% extends "base.html" %}
{% block content %}
<h2>Update Student Lists</h2>

<div style="background:var(--bg-card); padding:24px; border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2); max-width:500px; border:1px solid var(--border);">

    <p style="margin-bottom:16px; color:var(--text-secondary);">
        <b>The Excel file must contain these columns:</b><br>
        <code style="color:var(--text-primary);">name, roll, section, login_email,
        login_password, guardian_email, semester</code>
    </p>

    <form method="POST" enctype="multipart/form-data">
        <div class="form-group" style="margin-bottom:14px;">
            <label>কোন Semester এর জন্য এই sheet?</label>
            <select name="semester" required
                style="background:var(--bg-primary); border:1px solid var(--border); border-radius:8px; padding:8px 12px; color:var(--text-primary); width:100%;">
                <option value="">-- Semester সিলেক্ট করুন --</option>
                {% for s in semesters %}
                <option value="{{ s }}">{{ s }}</option>
                {% endfor %}
            </select>
        </div>
    
        <label>Excel File (.xlsx)</label>
        <input type="file" name="excel_file" accept=".xlsx">
        <button type="submit">Upload</button>
    </form>
</div>
{% endblock %}
