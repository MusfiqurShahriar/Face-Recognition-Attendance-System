{% extends "base.html" %}
{% block content %}

<h2>📚 Running Sessions</h2>

<div class="stats-grid">
        {% for s in sessions %}
        <div class="stat-card" style="cursor:pointer; text-align:left; padding: 20px;"
                onclick="window.location.href='{{ url_for('admin.session_courses', session_id=s.id) }}'">
                <div class="stat-number" style="font-size: 1.4rem;">{{ s.name }}</div>
                <div class="stat-label">সেশন দেখতে ক্লিক করুন →</div>
        </div>
        {% endfor %}

        {% if sessions|length == 0 %}
        <div class="notification-box">
                <div>
                        <h3>কোনো সেশন পাওয়া যায়নি</h3>
                        <p>নতুন সেশন যোগ করতে অ্যাডমিনের সাথে যোগাযোগ করুন</p>
                </div>
        </div>
        {% endif %}
</div>

{% endblock %}
